buildscript {
    repositories {
        maven { name = 'AliyunPublic'; url = 'https://maven.aliyun.com/repository/public/' }
        maven { name = 'AliyunCentral'; url = 'https://maven.aliyun.com/repository/central' }
        maven { name = 'HuaweiCloud'; url = 'https://repo.huaweicloud.com/repository/maven/' }
        maven { name = 'Forge'; url = 'https://files.minecraftforge.net/maven' }
        maven { name = 'Sponge'; url = 'https://repo.spongepowered.org/maven' }
        mavenCentral()
    }

    configurations.all {
        resolutionStrategy {
            cacheChangingModulesFor 365, 'days'
            cacheDynamicVersionsFor 365, 'days'
        }
    }

    dependencies {
        classpath('net.minecraftforge.gradle:ForgeGradle:3.0.197') {
            exclude group: 'net.minecraftforge', module: 'artifactural'
        }
        classpath 'net.minecraftforge:artifactural:1.0.13'
        classpath('org.spongepowered:mixingradle:0.7-SNAPSHOT') { changing = false }
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'
apply plugin: 'org.spongepowered.mixin'

configurations.all {
    resolutionStrategy {
        cacheChangingModulesFor 365, 'days'
        cacheDynamicVersionsFor 365, 'days'
    }
}

mixin {
    add sourceSets.main, 'refmap.genshin.json'
    config 'genshin.mixins.json'
}

version = '1.0'
group = 'com.vbuser.genshin'
archivesBaseName = 'genshin'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'
    runs {
        client {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            arg '-torg.spongepowered.asm.launch.MixinTweaker'
        }

        server {
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            arg '-torg.spongepowered.asm.launch.MixinTweaker'
        }
    }
}

repositories {
    maven { name = 'AliyunPublic'; url = 'https://maven.aliyun.com/repository/public/' }
    maven { name = 'AliyunCentral'; url = 'https://maven.aliyun.com/repository/central' }
    maven { name = 'HuaweiCloud'; url = 'https://repo.huaweicloud.com/repository/maven/' }
    maven { name = 'Forge'; url = 'https://files.minecraftforge.net/maven' }
    maven { name = 'GeckoLib'; url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven' }
    maven { name = 'Sponge'; url = 'https://repo.spongepowered.org/maven' }
    mavenCentral()
}

tasks.matching { it.name == 'downloadMcpConfig' }.all { t ->
    t.onlyIf {
        def out = null
        try { out = t.output } catch (Exception ignored) { }
        if (out == null) { out = new File(project.buildDir, 'downloadMcpConfig/output.zip') }
        !new File(out.toString()).exists()
    }
}

configurations {
    embed
    compile.extendsFrom(embed)
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2854'
    embed files("libs/jfxrt.jar")
    embed files("libs/ime.jar")
    implementation fg.deobf('software.bernie.geckolib:forge-1.12.2-geckolib:3.0.21')
    embed 'com.h2database:h2:2.1.214'
    embed('org.spongepowered:mixin:0.8.3-SNAPSHOT') {
        changing = false
        exclude module: 'guava'
        exclude module: 'commons-io'
        exclude module: 'gson'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    from {
        configurations.embed.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        exclude 'LICENSE.txt', 'META-INF/MANIFEST.MF', 'META-INF/maven/**', 'META-INF/*.RSA', 'META-INF/*.SF'
    }

    manifest.attributes(
            'ForceLoadAsMod': 'true',
            'FMLCorePluginContainsFMLMod': 'true',
            'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker',
            'TweakOrder': '0'
    )
}

jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}

sourceSets {
    main {
        output.resourcesDir = output.classesDir
    }
}