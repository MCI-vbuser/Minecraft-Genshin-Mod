# Gradle / ForgeGradle settings for this project.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# ---- network timeouts: fail fast instead of hanging forever ----
systemProp.sun.net.client.defaultConnectTimeout=2000
systemProp.sun.net.client.defaultReadTimeout=5000
systemProp.org.gradle.internal.http.connectionTimeout=15000
systemProp.org.gradle.internal.http.socketTimeout=30000

# ---- modern CA trust store ----
# JDK 8u191's built-in cacerts predates Let's Encrypt ISRG Root X1/X2, so every
# modern HTTPS host (Maven Central, Forge, Mojang) fails with "PKIX path building failed".
# This file is a JKS copy of a current JDK's cacerts (the JBR bundled with CLion 2025),
# scoped to Gradle only. NOTE: .properties treats "\" as escape - use forward slashes.
systemProp.javax.net.ssl.trustStore=C:/Users/ASUS/Desktop/mdk/tools/cnproxy/cacerts-modern.jks
systemProp.javax.net.ssl.trustStorePassword=changeit
systemProp.javax.net.ssl.trustStoreType=JKS

# ---- optional: your own real proxy (Clash / v2rayN etc.) ----
#systemProp.http.proxyHost=127.0.0.1
#systemProp.http.proxyPort=7897
#systemProp.https.proxyHost=127.0.0.1
#systemProp.https.proxyPort=7897

