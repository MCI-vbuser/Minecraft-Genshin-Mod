# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# ==================== 国内网络相关 ====================
# 说明：这里有两类"联网"。
#   A. Gradle 自己去仓库查版本/maven-metadata —— 已经在 build.gradle 里锁死动态版本解决。
#   B. ForgeGradle 自己用 HttpURLConnection 访问 launchermeta.mojang.com / files.minecraftforge.net ——
#      这部分不走 Gradle 的仓库配置，--offline 也拦不住，只能靠"网络通"或"代理"。

# 1) 让 A、B 两类请求都快速失败，而不是无限等待（毫秒）。
#    systemProp.* 会被设置到构建 JVM 的 -D 参数上，ForgeGradle 的 URLConnection 也认。
systemProp.sun.net.client.defaultConnectTimeout=15000
systemProp.sun.net.client.defaultReadTimeout=30000
systemProp.org.gradle.internal.http.connectionTimeout=15000
systemProp.org.gradle.internal.http.socketTimeout=30000

# 2) 代理：这是让 B 类请求变快的唯一办法（FG 里的地址是硬编码的，没有 mirror 可换）。
#    有 Clash / v2rayN 等本地代理时，取消注释并改成自己的端口。
#systemProp.http.proxyHost=127.0.0.1
#systemProp.http.proxyPort=7897
#systemProp.https.proxyHost=127.0.0.1
#systemProp.https.proxyPort=7897
#systemProp.http.nonProxyHosts=localhost|127.0.0.1
#systemProp.https.nonProxyHosts=localhost|127.0.0.1
